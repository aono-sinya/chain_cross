[profile.default]
src       = "contracts"
out       = "out"
libs      = ["lib"]
script    = "script"
test      = "test"
solc      = "0.8.28"
optimizer = true
optimizer_runs = 200
# Foundry が forge-std などを欲しがらないようリモートのリマップは無し
remappings = ["forge-std/=lib/forge-std/src/"]

# 内部 RPC (docker-compose のサービス名)
[rpc_endpoints]
besu = "${BESU_RPC_URL}"

# `forge script --broadcast` 時に EIP-1559 を強制しない (Besu dev mode 互換)
[profile.default.fmt]
line_length = 120

